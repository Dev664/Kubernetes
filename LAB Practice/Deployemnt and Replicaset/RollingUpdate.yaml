apiVersion: apps/v1              # Deployment API

kind: Deployment                 # Resource type

metadata:
  name: nginx-deployment         # Name of the deployment

  labels:
    app: nginx                   # Label for identifying resources

spec:
  replicas: 3                    # Run 3 pod replicas

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: nginx                 # Deployment manages pods with this label

  template:
    metadata:
      labels:
        app: nginx                # Pod label (must match selector)

    spec:
      containers:
      - name: nginx               # Container name
        image: nginx:1.20         # OLD version of nginx
        ports:
        - containerPort: 80       # Container listens on port 80
